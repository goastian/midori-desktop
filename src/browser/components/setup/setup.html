<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome:; object-src 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Midori Setup</title>

    <link
      rel="stylesheet"
      type="text/css"
      href="chrome://global/skin/in-content/common.css"
    />
    <link
      rel="stylesheet"
      href="chrome://browser/content/setup/setup.css"
    />

    <link rel="localization" href="branding/brand.ftl" />
    <link rel="localization" href="browser/welcome.ftl" />
  </head>
  <body>
    <!-- Step indicator at the top -->
    <div class="step-indicator">
      <div class="step-dot"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
    </div>

    <div class="page" id="welcome">
      <img class="icon" src="chrome://branding/content/about-logo.png" />
      <h2 data-l10n-id="welcome-dialog-welcome"></h2>

      <p data-l10n-id="welcome-dialog-welcome-subtext"></p>

      <button
        id="welcomeNext"
        class="primary"
        data-l10n-id="welcome-dialog-get-started"
      ></button>
    </div>

    <div class="page" id="import">
      <img
        class="asset light-only"
        src="chrome://browser/content/setup/migrate.light.svg"
      />
      <img
        class="asset dark-only"
        src="chrome://browser/content/setup/migrate.dark.svg"
      />

      <h2 data-l10n-id="welcome-dialog-import"></h2>
      <p data-l10n-id="welcome-dialog-import-subtext"></p>

      <br />

      <hbox>
        <button
          id="importBack"
          data-l10n-id="welcome-dialog-back"
        ></button>
        <button
          class="primary"
          id="importBrowser"
          data-l10n-id="welcome-dialog-import-action"
        ></button>
        <button
          class="text-link"
          id="importNext"
          data-l10n-id="welcome-dialog-skip"
        ></button>
      </hbox>
    </div>

    <div class="page" id="color">
      <h2 data-l10n-id="welcome-dialog-color"></h2>
      <p data-l10n-id="welcome-dialog-color-subtext"></p>

      <div class="colorway-options">
        <div class="colorway-card selected" id="colorwayJade" data-colorway="jade" data-tone="light">
          <div class="colorway-preview jade"></div>
          <h3 data-l10n-id="welcome-dialog-color-jade"></h3>
        </div>
        <div class="colorway-card" id="colorwayOcean" data-colorway="ocean" data-tone="light">
          <div class="colorway-preview ocean"></div>
          <h3 data-l10n-id="welcome-dialog-color-ocean"></h3>
        </div>
        <div class="colorway-card" id="colorwaySunrise" data-colorway="sunrise" data-tone="light">
          <div class="colorway-preview sunrise"></div>
          <h3 data-l10n-id="welcome-dialog-color-sunrise"></h3>
        </div>
        <div class="colorway-card" id="colorwayForest" data-colorway="forest" data-tone="dark">
          <div class="colorway-preview forest"></div>
          <h3 data-l10n-id="welcome-dialog-color-forest"></h3>
        </div>
        <div class="colorway-card" id="colorwayMidnight" data-colorway="midnight" data-tone="dark">
          <div class="colorway-preview midnight"></div>
          <h3 data-l10n-id="welcome-dialog-color-midnight"></h3>
        </div>
        <div class="colorway-card" id="colorwayEmber" data-colorway="ember" data-tone="dark">
          <div class="colorway-preview ember"></div>
          <h3 data-l10n-id="welcome-dialog-color-ember"></h3>
        </div>
      </div>

      <hbox>
        <button
          id="colorBack"
          data-l10n-id="welcome-dialog-back"
        ></button>
        <button
          id="colorNext"
          class="primary"
          data-l10n-id="welcome-dialog-color-action"
        ></button>
      </hbox>
    </div>

    <div class="page" id="tablayout">
      <h2 data-l10n-id="welcome-dialog-tablayout"></h2>
      <p data-l10n-id="welcome-dialog-tablayout-subtext"></p>

      <div class="tablayout-options">
        <div class="tablayout-card selected" id="tablayoutHorizontal">
          <div class="tablayout-preview tablayout-horizontal-preview">
            <div class="preview-toolbar">
              <div class="preview-tab active"></div>
              <div class="preview-tab"></div>
              <div class="preview-tab"></div>
            </div>
            <div class="preview-content"></div>
          </div>
          <h3 data-l10n-id="welcome-dialog-tablayout-horizontal"></h3>
          <p data-l10n-id="welcome-dialog-tablayout-horizontal-desc"></p>
        </div>

        <div class="tablayout-card" id="tablayoutHorizontalBottom">
          <div class="tablayout-preview tablayout-horizontal-bottom-preview">
            <div class="preview-content"></div>
            <div class="preview-toolbar">
              <div class="preview-tab active"></div>
              <div class="preview-tab"></div>
              <div class="preview-tab"></div>
            </div>
          </div>
          <h3 data-l10n-id="welcome-dialog-tablayout-horizontal-bottom"></h3>
          <p data-l10n-id="welcome-dialog-tablayout-horizontal-bottom-desc"></p>
        </div>

        <div class="tablayout-card" id="tablayoutVertical">
          <div class="tablayout-preview tablayout-vertical-preview">
            <div class="preview-sidebar">
              <div class="preview-vtab active"></div>
              <div class="preview-vtab"></div>
              <div class="preview-vtab"></div>
            </div>
            <div class="preview-content"></div>
          </div>
          <h3 data-l10n-id="welcome-dialog-tablayout-vertical"></h3>
          <p data-l10n-id="welcome-dialog-tablayout-vertical-desc"></p>
        </div>

        <div class="tablayout-card" id="tablayoutVerticalRight">
          <div class="tablayout-preview tablayout-vertical-right-preview">
            <div class="preview-content"></div>
            <div class="preview-sidebar">
              <div class="preview-vtab active"></div>
              <div class="preview-vtab"></div>
              <div class="preview-vtab"></div>
            </div>
          </div>
          <h3 data-l10n-id="welcome-dialog-tablayout-vertical-right"></h3>
          <p data-l10n-id="welcome-dialog-tablayout-vertical-right-desc"></p>
        </div>
      </div>

      <section class="urlbar-order-section" id="urlbarOrderSection" aria-labelledby="urlbarOrderTitle">
        <h3 id="urlbarOrderTitle" data-l10n-id="welcome-dialog-urlbar-order"></h3>
        <p data-l10n-id="welcome-dialog-urlbar-order-subtext"></p>

        <div class="urlbar-order-options" role="radiogroup" aria-labelledby="urlbarOrderTitle">
          <div
            class="urlbar-order-card selected"
            id="urlbarOrderAddressTop"
            role="radio"
            tabindex="0"
            aria-checked="true"
          >
            <div class="urlbar-order-preview" aria-hidden="true">
              <div class="preview-address-row"><span></span></div>
              <div class="preview-tabs-row"><span class="active"></span><span></span><span></span></div>
              <div class="preview-page-area"></div>
            </div>
            <div class="urlbar-order-copy">
              <h4 data-l10n-id="welcome-dialog-urlbar-order-address-top"></h4>
              <p data-l10n-id="welcome-dialog-urlbar-order-address-top-desc"></p>
            </div>
          </div>

          <div
            class="urlbar-order-card"
            id="urlbarOrderTabsTop"
            role="radio"
            tabindex="0"
            aria-checked="false"
          >
            <div class="urlbar-order-preview" aria-hidden="true">
              <div class="preview-tabs-row"><span class="active"></span><span></span><span></span></div>
              <div class="preview-address-row"><span></span></div>
              <div class="preview-page-area"></div>
            </div>
            <div class="urlbar-order-copy">
              <h4 data-l10n-id="welcome-dialog-urlbar-order-tabs-top"></h4>
              <p data-l10n-id="welcome-dialog-urlbar-order-tabs-top-desc"></p>
            </div>
          </div>
        </div>
      </section>

      <hbox>
        <button
          id="tablayoutBack"
          data-l10n-id="welcome-dialog-back"
        ></button>
        <button
          id="tablayoutNext"
          class="primary"
          data-l10n-id="welcome-dialog-tablayout-action"
        ></button>
      </hbox>
    </div>

    <div class="page" id="msidebar">
      <h2 id="msidebarTitle" data-l10n-id="welcome-dialog-msidebar"></h2>
      <p data-l10n-id="welcome-dialog-msidebar-subtext"></p>

      <div class="tablayout-options msidebar-enable-options" role="radiogroup" aria-labelledby="msidebarTitle">
        <div
          class="tablayout-card selected"
          id="msidebarEnable"
          role="radio"
          tabindex="0"
          aria-checked="true"
        >
          <h3 data-l10n-id="welcome-dialog-msidebar-enable"></h3>
        </div>
        <div
          class="tablayout-card"
          id="msidebarDisable"
          role="radio"
          tabindex="-1"
          aria-checked="false"
        >
          <h3 data-l10n-id="welcome-dialog-msidebar-disable"></h3>
        </div>
      </div>

      <section class="setup-customization" aria-labelledby="msidebarCustomizationTitle">
        <fieldset class="setup-control-group" id="msidebarPositionGroup">
          <legend id="msidebarCustomizationTitle" data-l10n-id="welcome-dialog-msidebar-position"></legend>
          <p class="setup-group-description" id="msidebarPositionHorizontalHint" data-l10n-id="welcome-dialog-msidebar-position-horizontal-desc"></p>
          <p class="setup-group-description" id="msidebarPositionVerticalHint" data-l10n-id="welcome-dialog-msidebar-position-vertical-desc" hidden></p>

          <div class="sidebar-position-options">
            <label class="sidebar-position-card" data-side="left" for="msidebarPositionLeft">
              <input type="radio" id="msidebarPositionLeft" name="msidebarPosition" value="left" />
              <span class="sidebar-position-preview" aria-hidden="true">
                <span class="setup-preview-content"></span>
                <span class="setup-preview-sidebar"></span>
              </span>
              <span data-l10n-id="welcome-dialog-msidebar-position-left"></span>
            </label>

            <label class="sidebar-position-card" data-side="right" for="msidebarPositionRight">
              <input type="radio" id="msidebarPositionRight" name="msidebarPosition" value="right" />
              <span class="sidebar-position-preview" aria-hidden="true">
                <span class="setup-preview-content"></span>
                <span class="setup-preview-sidebar"></span>
              </span>
              <span data-l10n-id="welcome-dialog-msidebar-position-right"></span>
            </label>
          </div>
        </fieldset>

        <fieldset class="setup-control-group" id="autohideGroup">
          <legend data-l10n-id="welcome-dialog-autohide"></legend>
          <p class="setup-group-description" data-l10n-id="welcome-dialog-autohide-desc"></p>

          <label class="setup-switch-row" id="msidebarAutohideRow" for="msidebarAutohide">
            <span class="setup-switch-copy">
              <strong data-l10n-id="welcome-dialog-autohide-sidebar"></strong>
              <small data-l10n-id="welcome-dialog-autohide-sidebar-desc"></small>
            </span>
            <input type="checkbox" id="msidebarAutohide" />
            <span class="setup-switch-track" aria-hidden="true"></span>
          </label>

          <div class="setup-select-row dependent-control" id="msidebarAutohideModeRow">
            <label for="msidebarAutohideMode">
              <strong data-l10n-id="welcome-dialog-autohide-sidebar-mode"></strong>
              <small data-l10n-id="welcome-dialog-autohide-sidebar-mode-desc"></small>
            </label>
            <select id="msidebarAutohideMode">
              <option value="overlay" data-l10n-id="welcome-dialog-autohide-sidebar-mode-overlay"></option>
              <option value="inline" data-l10n-id="welcome-dialog-autohide-sidebar-mode-inline"></option>
            </select>
          </div>

          <label class="setup-switch-row" id="horizontalTabsAutohideRow" for="horizontalTabsAutohide">
            <span class="setup-switch-copy">
              <strong data-l10n-id="welcome-dialog-autohide-horizontal-tabs"></strong>
              <small data-l10n-id="welcome-dialog-autohide-horizontal-tabs-desc"></small>
            </span>
            <input type="checkbox" id="horizontalTabsAutohide" />
            <span class="setup-switch-track" aria-hidden="true"></span>
          </label>

          <label class="setup-switch-row dependent-control" id="inactiveWindowTabsRow" for="showInactiveWindowTabs">
            <span class="setup-switch-copy">
              <strong data-l10n-id="welcome-dialog-autohide-inactive-tabs"></strong>
              <small data-l10n-id="welcome-dialog-autohide-inactive-tabs-desc"></small>
            </span>
            <input type="checkbox" id="showInactiveWindowTabs" />
            <span class="setup-switch-track" aria-hidden="true"></span>
          </label>

          <label class="setup-switch-row" id="verticalTabsAutohideRow" for="verticalTabsAutohide" hidden>
            <span class="setup-switch-copy">
              <strong data-l10n-id="welcome-dialog-autohide-vertical-tabs"></strong>
              <small data-l10n-id="welcome-dialog-autohide-vertical-tabs-desc"></small>
            </span>
            <input type="checkbox" id="verticalTabsAutohide" />
            <span class="setup-switch-track" aria-hidden="true"></span>
          </label>

          <p class="setup-layout-notice" id="bottomTabsAutohideNotice" data-l10n-id="welcome-dialog-autohide-bottom-tabs" hidden></p>
        </fieldset>
      </section>

      <hbox>
        <button
          id="msidebarBack"
          data-l10n-id="welcome-dialog-back"
        ></button>
        <button
          id="msidebarNext"
          class="primary"
          data-l10n-id="welcome-dialog-msidebar-action"
        ></button>
      </hbox>
    </div>

    <div class="page" id="warmwelcome">
      <div class="warmwelcome-badge" aria-hidden="true">✓</div>
      <h2 data-l10n-id="welcome-dialog-warmwelcome"></h2>
      <p data-l10n-id="welcome-dialog-warmwelcome-subtext"></p>

      <hbox>
        <button
          id="warmwelcomeBack"
          data-l10n-id="welcome-dialog-back"
        ></button>
        <button
          id="warmwelcomeNext"
          class="primary"
          data-l10n-id="welcome-dialog-warmwelcome-action"
        ></button>
      </hbox>
    </div>

    <script type="module" src="chrome://browser/content/setup/setup.sys.mjs"></script>
    <script src="chrome://browser/content/contentTheme.js"></script>
  </body>
</html>
