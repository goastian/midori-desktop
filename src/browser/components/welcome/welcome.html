<!DOCTYPE html>
<html lang="en">
  <head>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome:; object-src 'none'"
    />
    <meta name="referrer" content="no-referrer" />

    <link
      rel="stylesheet"
      type="text/css"
      href="chrome://global/skin/in-content/common.css"
    />
    <link
      rel="stylesheet"
      href="chrome://browser/content/welcome/welcome.css"
    />
    <style>
      /* Force the dialog container to be larger */
      :root {
        min-width: 80vw !important;
        min-height: 80vh !important;
      }
    </style>

    <link rel="localization" href="branding/brand.ftl" />
    <link rel="localization" href="browser/welcome.ftl" />
  </head>
  <body>
    <div class="page" id="welcome">
      <img class="icon" src="chrome://branding/content/about-logo.png" />
      <h2 data-l10n-id="welcome-dialog-welcome"></h2>

      <p data-l10n-id="welcome-dialog-welcome-subtext"></p>

      <button
        id="welcomeNext"
        class="primary"
        data-l10n-id="welcome-dialog-get-started"
      ></button>
    </div>

    <div class="page" id="import">
      <img
        class="asset light-only"
        src="chrome://browser/content/welcome/migrate.light.svg"
      />
      <img
        class="asset dark-only"
        src="chrome://browser/content/welcome/migrate.dark.svg"
      />

      <h2 data-l10n-id="welcome-dialog-import"></h2>
      <p data-l10n-id="welcome-dialog-import-subtext"></p>

      <br />

      <hbox>
        <button
          class="primary"
          id="importBrowser"
          data-l10n-id="welcome-dialog-import-action"
        ></button>
        <button
          class="text-link"
          id="importNext"
          data-l10n-id="welcome-dialog-skip"
        ></button>
      </hbox>
    </div>

    <div class="page" id="theme">
      <h2 data-l10n-id="welcome-dialog-theme"></h2>
      <div id="themeList" class="cardGroup"></div>
      <button
        id="themeNext"
        class="primary"
        data-l10n-id="welcome-dialog-theme-action"
      ></button>
    </div>

    <div class="page" id="gradient">
      <h2 data-l10n-id="welcome-dialog-gradient"></h2>
      <p data-l10n-id="welcome-dialog-gradient-subtext"></p>

      <!-- Preset gradient cards -->
      <div id="gradientPresets" class="gradientPresetsGrid"></div>

      <!-- Custom gradient editor (collapsed by default) -->
      <details id="gradientCustomizer" class="gradient-customizer">
        <summary data-l10n-id="welcome-dialog-gradient-customize"></summary>

        <div class="gradient-editor">
          <!-- Live preview -->
          <div id="gradientPreview" class="gradient-preview"></div>

          <!-- Gradient type selector -->
          <div class="gradient-controls">
            <div class="control-row">
              <label data-l10n-id="welcome-dialog-gradient-type"></label>
              <select id="gradientType">
                <option value="linear">Linear</option>
                <option value="radial">Radial</option>
                <option value="conic">Conic</option>
              </select>
            </div>

            <!-- Angle control -->
            <div class="control-row" id="angleRow">
              <label data-l10n-id="welcome-dialog-gradient-angle"></label>
              <input
                type="range"
                id="gradientAngle"
                min="0"
                max="360"
                value="135"
              />
              <span id="angleValue">135°</span>
            </div>

            <!-- Color stops -->
            <div class="control-row">
              <label data-l10n-id="welcome-dialog-gradient-colors"></label>
              <div id="colorStops" class="color-stops"></div>
              <button id="addColorStop" class="icon-btn" title="Add color">+</button>
            </div>

            <!-- Texture overlay -->
            <div class="control-row">
              <label data-l10n-id="welcome-dialog-gradient-texture"></label>
              <select id="gradientTexture">
                <option value="none">None</option>
                <option value="noise">Noise</option>
                <option value="dots">Dots</option>
                <option value="grid">Grid</option>
              </select>
            </div>
          </div>
        </div>
      </details>

      <hbox>
        <button
          id="gradientNext"
          class="primary"
          data-l10n-id="welcome-dialog-gradient-action"
        ></button>
        <button
          class="text-link"
          id="gradientSkip"
          data-l10n-id="welcome-dialog-skip"
        ></button>
      </hbox>
    </div>

    <div class="page" id="tablayout">
      <h2 data-l10n-id="welcome-dialog-tablayout"></h2>
      <p data-l10n-id="welcome-dialog-tablayout-subtext"></p>

      <div class="tablayout-options">
        <div class="tablayout-card selected" id="tablayoutHorizontal">
          <div class="tablayout-preview tablayout-horizontal-preview">
            <div class="preview-toolbar">
              <div class="preview-tab active"></div>
              <div class="preview-tab"></div>
              <div class="preview-tab"></div>
            </div>
            <div class="preview-content"></div>
          </div>
          <h3 data-l10n-id="welcome-dialog-tablayout-horizontal"></h3>
          <p data-l10n-id="welcome-dialog-tablayout-horizontal-desc"></p>
        </div>

        <div class="tablayout-card" id="tablayoutHorizontalBottom">
          <div class="tablayout-preview tablayout-horizontal-bottom-preview">
            <div class="preview-content"></div>
            <div class="preview-toolbar">
              <div class="preview-tab active"></div>
              <div class="preview-tab"></div>
              <div class="preview-tab"></div>
            </div>
          </div>
          <h3 data-l10n-id="welcome-dialog-tablayout-horizontal-bottom"></h3>
          <p data-l10n-id="welcome-dialog-tablayout-horizontal-bottom-desc"></p>
        </div>

        <div class="tablayout-card" id="tablayoutVertical">
          <div class="tablayout-preview tablayout-vertical-preview">
            <div class="preview-sidebar">
              <div class="preview-vtab active"></div>
              <div class="preview-vtab"></div>
              <div class="preview-vtab"></div>
            </div>
            <div class="preview-content"></div>
          </div>
          <h3 data-l10n-id="welcome-dialog-tablayout-vertical"></h3>
          <p data-l10n-id="welcome-dialog-tablayout-vertical-desc"></p>
        </div>

        <div class="tablayout-card" id="tablayoutVerticalRight">
          <div class="tablayout-preview tablayout-vertical-right-preview">
            <div class="preview-content"></div>
            <div class="preview-sidebar">
              <div class="preview-vtab active"></div>
              <div class="preview-vtab"></div>
              <div class="preview-vtab"></div>
            </div>
          </div>
          <h3 data-l10n-id="welcome-dialog-tablayout-vertical-right"></h3>
          <p data-l10n-id="welcome-dialog-tablayout-vertical-right-desc"></p>
        </div>
      </div>

      <button
        id="tablayoutNext"
        class="primary"
        data-l10n-id="welcome-dialog-tablayout-action"
      ></button>
    </div>

    <div class="page" id="msidebar">
      <h2 data-l10n-id="welcome-dialog-msidebar"></h2>
      <p data-l10n-id="welcome-dialog-msidebar-subtext"></p>

      <div class="tablayout-options">
        <div class="tablayout-card selected" id="msidebarEnable">
          <h3 data-l10n-id="welcome-dialog-msidebar-enable"></h3>
        </div>
        <div class="tablayout-card" id="msidebarDisable">
          <h3 data-l10n-id="welcome-dialog-msidebar-disable"></h3>
        </div>
      </div>

      <button
        id="msidebarNext"
        class="primary"
        data-l10n-id="welcome-dialog-msidebar-action"
      ></button>
    </div>

    <div class="page" id="search">
      <h2 data-l10n-id="welcome-dialog-search"></h2>
      <div id="searchList" class="cardGroup"></div>
      <button
        id="searchNext"
        class="primary"
        data-l10n-id="welcome-dialog-search-action"
      ></button>
    </div>

    <div class="page" id="apps">
      <h2 data-l10n-id="welcome-dialog-apps"></h2>
      <p data-l10n-id="welcome-dialog-apps-subtext"></p>

      <div class="cardGroup" id="appsList"></div>

      <button
        id="appsNext"
        class="primary"
        data-l10n-id="welcome-dialog-apps-action"
      ></button>
    </div>

    <script type="module" src="chrome://browser/content/welcome/welcome.sys.mjs"></script>
    <script src="chrome://browser/content/contentTheme.js"></script>
  </body>
</html>
