[DEFAULT]
firefox-appdir = "browser"
prefs = [
  "midori.sync.enabled=true",
  'midori.sync.serverConfig={"baseURL":"http://localhost:9/","allowLocalHTTP":true}',
  "services.sync.username=existing@example.invalid",
  "dom.battery.enabled=true",
  "dom.battery.test.default=true",
  "midori.blocker.enabled=false",
  "browser.backup.enabled=false",
  "timer.ignore_sleep_wake_notifications=true",
  "ui.prefersReducedMotion=1",
]

["browser_sync_oidc_popup.js"]

["browser_firefox_sync_preferences.js"]

["browser_sync_data.js"]

["browser_sync_preference_persistence.js"]

["browser_sync_conflicts.js"]

["browser_sync_native_conflicts.js"]

["browser_sync_addresses.js"]
support-files = ["file_sync_autofill.html"]

["browser_sync_cards.js"]
support-files = ["file_sync_cards.html"]

["browser_sync_form_history.js"]
support-files = ["file_sync_autofill.html"]

["browser_sync_hints.js"]

["browser_sync_journals.js"]

["browser_sync_keys.js"]

["browser_sync_popup.js"]

["browser_sync_page.js"]

