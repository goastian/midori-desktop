name: Flatpak Packaging

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Midori version to publish to the Flatpak repo, without leading v"
        required: false
        type: string
      source_sha:
        description: "Optional SHA256 for midori-<version>-src.tar.xz"
        required: false
        type: string
      source_commit:
        description: "Optional source commit for the Midori release tag"
        required: false
        type: string
      update_node_sources:
        description: "Regenerate generated-sources.json from package-lock.json"
        required: false
        type: boolean
        default: true
      lint:
        description: "Run flatpak-builder-lint before pushing"
        required: false
        type: boolean
        default: true
      build_flatpak:
        description: "Build and publish Flatpak bundles after updating the packaging repo"
        required: false
        type: boolean
        default: false
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  sync-packaging-repo:
    name: Sync org.astian.midori_browser
    runs-on: ubuntu-latest
    if: github.event_name != 'release' || github.event.release.prerelease == false
    outputs:
      version: ${{ steps.meta.outputs.version }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
    steps:
      - name: Checkout midori-desktop
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Resolve Flatpak metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ] && [ -n "$RELEASE_TAG" ]; then
            VERSION="${RELEASE_TAG#v}"
          fi
          if [ -z "$VERSION" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi

          SOURCE_SHA="$INPUT_SOURCE_SHA"
          if [ -z "$SOURCE_SHA" ]; then
            mkdir -p /tmp/flatpak-release
            if gh release download "v$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern SHA256SUMS.txt \
              --dir /tmp/flatpak-release; then
              SOURCE_SHA="$(awk -v file="midori-$VERSION-src.tar.xz" '$2 == file {print $1}' /tmp/flatpak-release/SHA256SUMS.txt)"
            else
              echo "SHA256SUMS.txt not available for v$VERSION; preserving manifest sha256"
            fi
          fi

          if [ "$GITHUB_EVENT_NAME" = "release" ] && [ -z "$SOURCE_SHA" ]; then
            echo "The published release does not contain a SHA256 for its Flatpak source bundle." >&2
            exit 1
          fi

          SOURCE_COMMIT="$INPUT_SOURCE_COMMIT"
          if [ -z "$SOURCE_COMMIT" ]; then
            SOURCE_COMMIT="$(git rev-list -n 1 "v$VERSION" 2>/dev/null || git rev-parse HEAD)"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout Flatpak packaging repo
        uses: actions/checkout@v7
        with:
          repository: goastian/org.astian.midori_browser
          token: ${{ secrets.PACKAGING_TOKEN }}
          path: flatpak-repo
          ref: main

      - name: Update Flatpak release files
        run: |
          set -euo pipefail

          args=(
            --repo flatpak-repo
            --version "${{ steps.meta.outputs.version }}"
            --source-commit "${{ steps.meta.outputs.source_commit }}"
          )

          if [ -n "${{ steps.meta.outputs.source_sha }}" ]; then
            args+=(--source-sha "${{ steps.meta.outputs.source_sha }}")
          fi

          python3 scripts/update-flatpak-release.py "${args[@]}"

      - name: Setup Node.js
        if: github.event_name != 'workflow_dispatch' || inputs.update_node_sources
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Regenerate Flatpak npm sources
        if: github.event_name != 'workflow_dispatch' || inputs.update_node_sources
        run: |
          python3 -m pip install --user flatpak-node-generator
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          bash scripts/refresh-node-sources.sh package-lock.json flatpak-repo/generated-sources.json

      - name: Install Flatpak lint tools
        if: github.event_name != 'workflow_dispatch' || inputs.lint
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.flatpak.Builder

      - name: Lint Flatpak manifest
        if: github.event_name != 'workflow_dispatch' || inputs.lint
        run: |
          flatpak run --user --command=flatpak-builder-lint org.flatpak.Builder manifest flatpak-repo/org.astian.midori_browser.yml

      - name: Lint Flatpak appstream
        if: github.event_name != 'workflow_dispatch' || inputs.lint
        run: |
          set +e
          flatpak run --user --command=flatpak-builder-lint org.flatpak.Builder appstream flatpak-repo/org.astian.midori_browser.metainfo.xml 2>&1 | tee /tmp/flatpak-appstream-lint.log
          status="${PIPESTATUS[0]}"
          set -e

          if [ "$status" -ne 0 ]; then
            if grep -Eq "screenshot-image-not-found|url-not-reachable" /tmp/flatpak-appstream-lint.log; then
              echo "AppStream lint only failed because remote screenshots/URLs are not reachable yet."
              echo "The packaging sync can continue; Flathub will validate reachability once the release assets exist."
            else
              exit "$status"
            fi
          fi

      - name: Commit and push packaging update
        run: |
          cd flatpak-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git diff --cached --quiet && exit 0

          git commit -m "Update Flatpak packaging for Midori Browser ${{ steps.meta.outputs.version }}"
          git push origin main

  build-flatpak:
    name: Build Flatpak ${{ matrix.arch }}
    needs: sync-packaging-repo
    if: >-
      (github.event_name == 'release' || inputs.build_flatpak) &&
      needs.sync-packaging-repo.outputs.source_sha != ''
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Resolve release version
        id: version
        run: |
          VERSION="${{ needs.sync-packaging-repo.outputs.version }}"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout Flatpak packaging repo
        uses: actions/checkout@v7
        with:
          repository: goastian/org.astian.midori_browser
          token: ${{ secrets.PACKAGING_TOKEN }}
          path: flatpak-repo
          ref: main

      - name: Install Flatpak builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.flatpak.Builder

      - name: Build Flatpak bundle
        run: |
          flatpak-builder \
            --user \
            --force-clean \
            --repo=flatpak-repository \
            --arch=${{ matrix.arch }} \
            --install-deps-from=flathub \
            build-dir \
            flatpak-repo/org.astian.midori_browser.yml
          flatpak build-bundle \
            flatpak-repository \
            "midori-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.flatpak" \
            org.astian.midori_browser \
            --arch=${{ matrix.arch }}
          sha256sum "midori-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.flatpak" \
            > "midori-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.flatpak.sha256"

      - name: Summarize Flatpak package
        run: |
          file="midori-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.flatpak"
          size="$(du -h "$file" | cut -f1)"
          digest="$(sha256sum "$file" | cut -d' ' -f1)"
          {
            echo "### Flatpak ${{ matrix.arch }} package"
            echo
            echo "Artifact: \`flatpak-${{ matrix.arch }}\`"
            echo
            echo '| File | Format | Size | SHA-256 |'
            echo '| --- | --- | ---: | --- |'
            echo "| \`$file\` | \`flatpak\` | $size | \`$digest\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Flatpak artifact
        id: upload-flatpak-artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ matrix.arch }}
          path: |
            midori-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.flatpak
            midori-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.flatpak.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish Flatpak artifact link
        env:
          ARTIFACT_URL: ${{ steps.upload-flatpak-artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload-flatpak-artifact.outputs.artifact-digest }}
        run: |
          {
            echo
            echo "[Download Flatpak ${{ matrix.arch }} artifact]($ARTIFACT_URL)"
            echo
            echo "Artifact archive SHA-256: \`$ARTIFACT_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach Flatpak bundle to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "midori-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.flatpak" \
            "midori-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.flatpak.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
