name: Flatpak Packaging

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Midori version to publish to the Flatpak repo, without leading v"
        required: false
        type: string
      source_sha:
        description: "SHA256 of the published source tarball, not the Actions artifact digest"
        required: false
        type: string
      source_run_id:
        description: "Build run ID containing current source and Linux package artifacts for a validation bundle"
        required: false
        type: string
      source_commit:
        description: "Optional source commit for the Midori release tag"
        required: false
        type: string
      update_node_sources:
        description: "Regenerate generated-sources.json from package-lock.json"
        required: false
        type: boolean
        default: true
      lint:
        description: "Run flatpak-builder-lint before pushing"
        required: false
        type: boolean
        default: true
      build_flatpak:
        description: "Build Flatpak bundles after syncing published sources or from source_run_id"
        required: false
        type: boolean
        default: false
  release:
    types:
      - published

permissions:
  actions: read
  contents: write

jobs:
  sync-packaging-repo:
    name: Sync org.astian.midori_browser
    runs-on: ubuntu-latest
    if: github.event_name != 'release' || github.event.release.prerelease == false
    outputs:
      version: ${{ steps.meta.outputs.version }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      source_mode: ${{ steps.meta.outputs.source_mode }}
    steps:
      - name: Checkout midori-desktop
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Resolve Flatpak metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ] && [ -n "$RELEASE_TAG" ]; then
            VERSION="${RELEASE_TAG#v}"
          fi
          if [ -z "$VERSION" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi

          SOURCE_BUNDLE="midori-$VERSION-src.tar.xz"
          SOURCE_MODE="published-release"
          SOURCE_SHA="$INPUT_SOURCE_SHA"
          SOURCE_COMMIT="$INPUT_SOURCE_COMMIT"
          mkdir -p /tmp/flatpak-release

          if [ -n "$INPUT_SOURCE_RUN_ID" ]; then
            if [ -n "$SOURCE_SHA" ]; then
              echo "source_sha cannot be used with source_run_id." >&2
              echo "The Actions artifact digest is not the SHA-256 of $SOURCE_BUNDLE." >&2
              exit 1
            fi
            SOURCE_MODE="ci-artifact"
            SOURCE_RUN_STATUS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_SOURCE_RUN_ID" --jq '.status')"
            if [ "$SOURCE_RUN_STATUS" != "completed" ] && [ "$SOURCE_RUN_STATUS" != "in_progress" ]; then
              echo "Source run $INPUT_SOURCE_RUN_ID is not available: $SOURCE_RUN_STATUS" >&2
              exit 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_SOURCE_RUN_ID/artifacts" \
              --paginate \
              --jq '.artifacts[] | select(.expired == false) | .name' \
              > /tmp/flatpak-release/artifacts.txt
            for artifact in midori-src.tar.xz linux-x86_64 linux-aarch64; do
              if ! grep -Fxq "$artifact" /tmp/flatpak-release/artifacts.txt; then
                echo "Source run $INPUT_SOURCE_RUN_ID does not contain the required artifact: $artifact" >&2
                exit 1
              fi
            done
            if [ -z "$SOURCE_COMMIT" ]; then
              SOURCE_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_SOURCE_RUN_ID" --jq '.head_sha')"
            fi
          else
            if [ -z "$SOURCE_SHA" ]; then
              if gh release download "v$VERSION" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern SHA256SUMS.txt \
                --dir /tmp/flatpak-release; then
                SOURCE_SHA="$(awk -v file="$SOURCE_BUNDLE" '$2 == file {print $1}' /tmp/flatpak-release/SHA256SUMS.txt)"
              else
                echo "SHA256SUMS.txt is not available for v$VERSION." >&2
              fi
            fi

            if ! [[ "$SOURCE_SHA" =~ ^[[:xdigit:]]{64}$ ]] || [[ "$SOURCE_SHA" =~ ^0{64}$ ]]; then
              echo "Flatpak requires a valid SHA-256 for $SOURCE_BUNDLE in release v$VERSION." >&2
              echo "Publish $SOURCE_BUNDLE and SHA256SUMS.txt before synchronizing Flatpak packaging." >&2
              exit 1
            fi

            gh release view "v$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' > /tmp/flatpak-release/assets.txt
            if ! grep -Fxq "$SOURCE_BUNDLE" /tmp/flatpak-release/assets.txt; then
              echo "Release v$VERSION does not contain $SOURCE_BUNDLE." >&2
              echo "Flatpak packaging is not updated without its immutable source bundle." >&2
              exit 1
            fi

            if [ -z "$SOURCE_COMMIT" ]; then
              SOURCE_COMMIT="$(git rev-list -n 1 "v$VERSION" 2>/dev/null || git rev-parse HEAD)"
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "source_mode=$SOURCE_MODE" >> "$GITHUB_OUTPUT"

      - name: Checkout Flatpak packaging repo
        uses: actions/checkout@v7
        with:
          repository: goastian/org.astian.midori_browser
          token: ${{ secrets.PACKAGING_TOKEN }}
          path: flatpak-repo
          ref: master

      - name: Update Flatpak release files
        run: |
          set -euo pipefail

          args=(
            --repo flatpak-repo
            --version "${{ steps.meta.outputs.version }}"
            --source-commit "${{ steps.meta.outputs.source_commit }}"
          )

          if [ "${{ steps.meta.outputs.source_mode }}" = "ci-artifact" ]; then
            args+=(
              --source-path "midori-${{ steps.meta.outputs.version }}-src.tar.xz"
              --package-path "midori-linux-package.tar.xz"
            )
          elif [ -n "${{ steps.meta.outputs.source_sha }}" ]; then
            args+=(--source-sha "${{ steps.meta.outputs.source_sha }}")
          else
            args+=(--source-path "midori-${{ steps.meta.outputs.version }}-src.tar.xz")
          fi

          python3 scripts/update-flatpak-release.py "${args[@]}"
          install -Dm0755 scripts/flatpak-build-package.sh \
            flatpak-repo/flatpak-build-package.sh
          install -Dm0644 build/flatpak/distribution/policies.json \
            flatpak-repo/policies.json

          for support_file in \
            flatpak-build-package.sh \
            org.astian.midori_browser.desktop \
            org.astian.midori_browser.metainfo.xml \
            policies.json; do
            test -s "flatpak-repo/$support_file"
            grep -Fq "path: $support_file" \
              flatpak-repo/org.astian.midori_browser.yml
          done

      - name: Setup Node.js
        if: github.event_name != 'workflow_dispatch' || inputs.update_node_sources
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Regenerate Flatpak npm sources
        if: github.event_name != 'workflow_dispatch' || inputs.update_node_sources
        run: |
          python3 -m pip install --user flatpak-node-generator
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          bash scripts/refresh-node-sources.sh package-lock.json flatpak-repo/generated-sources.json

      - name: Install Flatpak lint tools
        if: github.event_name != 'workflow_dispatch' || inputs.lint
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.flatpak.Builder

      - name: Lint Flatpak manifest
        if: github.event_name != 'workflow_dispatch' || inputs.lint
        run: |
          set +e
          flatpak run --user --command=flatpak-builder-lint org.flatpak.Builder manifest flatpak-repo/org.astian.midori_browser.yml 2>&1 | tee /tmp/flatpak-manifest-lint.log
          status="${PIPESTATUS[0]}"
          set -e

          if [ "$status" -ne 0 ]; then
            if jq -e '.errors == ["appid-url-not-reachable"]' /tmp/flatpak-manifest-lint.log >/dev/null; then
              echo "Manifest lint only failed because astian.org is protected by Cloudflare on the hosted runner."
              echo "The manifest remains validated; URL reachability must be checked from outside the Cloudflare challenge."
            else
              exit "$status"
            fi
          fi

      - name: Lint Flatpak appstream
        if: github.event_name != 'workflow_dispatch' || inputs.lint
        run: |
          set +e
          flatpak run --user --command=flatpak-builder-lint org.flatpak.Builder appstream flatpak-repo/org.astian.midori_browser.metainfo.xml 2>&1 | tee /tmp/flatpak-appstream-lint.log
          status="${PIPESTATUS[0]}"
          set -e

          if [ "$status" -ne 0 ]; then
            if grep -Eq "screenshot-image-not-found|url-not-reachable" /tmp/flatpak-appstream-lint.log; then
              echo "AppStream lint only failed because remote screenshots/URLs are not reachable yet."
              echo "The packaging sync can continue; Flathub will validate reachability once the release assets exist."
            else
              exit "$status"
            fi
          fi

      - name: Commit and push packaging update
        if: steps.meta.outputs.source_mode == 'published-release'
        run: |
          cd flatpak-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git diff --cached --quiet && exit 0

          git commit -m "Update Flatpak packaging for Midori Browser ${{ steps.meta.outputs.version }}"
          git push origin master

      - name: Upload transient Flatpak packaging
        if: steps.meta.outputs.source_mode == 'ci-artifact'
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-packaging-worktree
          path: flatpak-repo
          retention-days: 1
          if-no-files-found: error

  build-flatpak:
    name: Build Flatpak ${{ matrix.arch }}
    needs: sync-packaging-repo
    if: >-
      (github.event_name == 'release' || inputs.build_flatpak) &&
      needs.sync-packaging-repo.outputs.source_mode != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Resolve release version
        id: version
        run: |
          VERSION="${{ needs.sync-packaging-repo.outputs.version }}"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/share/swift /usr/local/.ghcup || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          df -h

      - name: Checkout Flatpak packaging repo
        if: needs.sync-packaging-repo.outputs.source_mode == 'published-release'
        uses: actions/checkout@v7
        with:
          repository: goastian/org.astian.midori_browser
          token: ${{ secrets.PACKAGING_TOKEN }}
          path: flatpak-repo
          ref: master

      - name: Download transient Flatpak packaging
        if: needs.sync-packaging-repo.outputs.source_mode == 'ci-artifact'
        uses: actions/download-artifact@v8
        with:
          name: flatpak-packaging-worktree
          path: flatpak-repo

      - name: Verify Flatpak packaging contract
        run: |
          set -euo pipefail
          for support_file in \
            flatpak-build-package.sh \
            org.astian.midori_browser.desktop \
            org.astian.midori_browser.metainfo.xml \
            policies.json; do
            test -s "flatpak-repo/$support_file"
            grep -Fq "path: $support_file" \
              flatpak-repo/org.astian.midori_browser.yml
          done

      - name: Download Flatpak source artifact
        if: needs.sync-packaging-repo.outputs.source_mode == 'ci-artifact'
        uses: actions/download-artifact@v8
        with:
          name: midori-src.tar.xz
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: flatpak-repo

      - name: Download Linux package artifact
        if: needs.sync-packaging-repo.outputs.source_mode == 'ci-artifact'
        uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: linux-artifact

      - name: Stage native Linux package
        if: needs.sync-packaging-repo.outputs.source_mode == 'ci-artifact'
        run: |
          set -euo pipefail
          mapfile -t package_files < <(
            find linux-artifact -type f \
              -name '*linux-${{ matrix.arch }}*.tar.xz' -print
          )
          if [ "${#package_files[@]}" -ne 1 ]; then
            echo "Expected exactly one Linux ${{ matrix.arch }} package; found ${#package_files[@]}." >&2
            printf '%s\n' "${package_files[@]}" >&2
            exit 1
          fi
          package_file="${package_files[0]}"
          tar -tJf "$package_file" >/dev/null

          arch_check_dir="$(mktemp -d)"
          trap 'rm -rf "$arch_check_dir"' EXIT
          tar -xJf "$package_file" -C "$arch_check_dir"
          package_binary="$(
            find "$arch_check_dir" -type f -name midori-bin -print -quit
          )"
          if [ -z "$package_binary" ]; then
            package_binary="$(
              find "$arch_check_dir" -type f -name midori -print -quit
            )"
          fi
          if [ -z "$package_binary" ]; then
            echo "The Linux package does not contain a Midori executable." >&2
            exit 1
          fi
          binary_type="$(file -Lb "$package_binary")"
          case "${{ matrix.arch }}:$binary_type" in
            x86_64:*x86-64* | aarch64:*ARM\ aarch64*) ;;
            *)
              echo "Linux package architecture mismatch: $binary_type" >&2
              exit 1
              ;;
          esac

          cp "$package_file" flatpak-repo/midori-linux-package.tar.xz
          package_sha="$(sha256sum flatpak-repo/midori-linux-package.tar.xz | cut -d' ' -f1)"
          {
            echo "### Native Linux package reused by Flatpak"
            echo
            echo "| Architecture | File | SHA-256 |"
            echo "| --- | --- | --- |"
            echo "| \`${{ matrix.arch }}\` | \`$(basename "$package_file")\` | \`$package_sha\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify local Flatpak source
        if: needs.sync-packaging-repo.outputs.source_mode == 'ci-artifact'
        run: |
          source_file="flatpak-repo/midori-${{ steps.version.outputs.version }}-src.tar.xz"
          test -s "$source_file"
          source_sha="$(sha256sum "$source_file" | cut -d' ' -f1)"
          {
            echo "### Flatpak validation source"
            echo
            echo "Using source artifact from run \`${{ inputs.source_run_id }}\`."
            echo
            echo "| File | SHA-256 |"
            echo "| --- | --- |"
            echo "| \`$(basename "$source_file")\` | \`$source_sha\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Flatpak builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.flatpak.Builder

      - name: Build Flatpak bundle
        run: |
          flatpak-builder \
            --user \
            --force-clean \
            --repo=flatpak-repository \
            --arch=${{ matrix.arch }} \
            --install-deps-from=flathub \
            build-dir \
            flatpak-repo/org.astian.midori_browser.yml
          flatpak build-bundle \
            flatpak-repository \
            "midori-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.flatpak" \
            org.astian.midori_browser \
            --arch=${{ matrix.arch }}
          sha256sum "midori-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.flatpak" \
            > "midori-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.flatpak.sha256"

      - name: Summarize Flatpak package
        run: |
          file="midori-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.flatpak"
          size="$(du -h "$file" | cut -f1)"
          digest="$(sha256sum "$file" | cut -d' ' -f1)"
          {
            echo "### Flatpak ${{ matrix.arch }} package"
            echo
            echo "Artifact: \`flatpak-${{ matrix.arch }}\`"
            echo
            echo '| File | Format | Size | SHA-256 |'
            echo '| --- | --- | ---: | --- |'
            echo "| \`$file\` | \`flatpak\` | $size | \`$digest\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Flatpak artifact
        id: upload-flatpak-artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ matrix.arch }}
          path: |
            midori-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.flatpak
            midori-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.flatpak.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish Flatpak artifact link
        env:
          ARTIFACT_URL: ${{ steps.upload-flatpak-artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload-flatpak-artifact.outputs.artifact-digest }}
        run: |
          {
            echo
            echo "[Download Flatpak ${{ matrix.arch }} artifact]($ARTIFACT_URL)"
            echo
            echo "Artifact archive SHA-256: \`$ARTIFACT_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach Flatpak bundle to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "midori-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.flatpak" \
            "midori-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.flatpak.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
