name: Flatpak Packaging

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Midori version to publish to the Flatpak repo, without leading v"
        required: false
        type: string
      source_sha:
        description: "Optional SHA256 for midori-<version>.source.tar.xz"
        required: false
        type: string
      source_commit:
        description: "Optional source commit for the Midori release tag"
        required: false
        type: string
      update_node_sources:
        description: "Regenerate generated-sources.json from package-lock.json"
        required: false
        type: boolean
        default: true
      lint:
        description: "Run flatpak-builder-lint before pushing"
        required: false
        type: boolean
        default: true
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  sync-packaging-repo:
    name: Sync org.astian.midori_browser
    runs-on: ubuntu-latest
    if: github.event_name != 'release' || github.event.release.prerelease == false
    steps:
      - name: Checkout midori-desktop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Resolve Flatpak metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ] && [ -n "$RELEASE_TAG" ]; then
            VERSION="${RELEASE_TAG#v}"
          fi
          if [ -z "$VERSION" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi

          SOURCE_COMMIT="$INPUT_SOURCE_COMMIT"
          if [ -z "$SOURCE_COMMIT" ]; then
            SOURCE_COMMIT="$(git rev-list -n 1 "v$VERSION" 2>/dev/null || git rev-parse HEAD)"
          fi

          SOURCE_SHA="$INPUT_SOURCE_SHA"
          if [ -z "$SOURCE_SHA" ]; then
            mkdir -p /tmp/flatpak-release
            if gh release download "v$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern SHA256SUMS.txt \
              --dir /tmp/flatpak-release; then
              SOURCE_SHA="$(awk -v file="midori-$VERSION.source.tar.xz" '$2 == file {print $1}' /tmp/flatpak-release/SHA256SUMS.txt)"
            else
              echo "SHA256SUMS.txt not available for v$VERSION; preserving manifest sha256"
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout Flatpak packaging repo
        uses: actions/checkout@v4
        with:
          repository: goastian/org.astian.midori_browser
          token: ${{ secrets.PACKAGING_TOKEN }}
          path: flatpak-repo
          ref: main

      - name: Update Flatpak release files
        run: |
          set -euo pipefail

          args=(
            --repo flatpak-repo
            --version "${{ steps.meta.outputs.version }}"
            --source-commit "${{ steps.meta.outputs.source_commit }}"
          )

          if [ -n "${{ steps.meta.outputs.source_sha }}" ]; then
            args+=(--source-sha "${{ steps.meta.outputs.source_sha }}")
          fi

          python3 scripts/update-flatpak-release.py "${args[@]}"

      - name: Setup Node.js
        if: github.event_name == 'release' || inputs.update_node_sources
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate Flatpak npm sources
        if: github.event_name == 'release' || inputs.update_node_sources
        run: |
          python3 -m pip install --user flatpak-node-generator
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          bash scripts/refresh-node-sources.sh package-lock.json flatpak-repo/generated-sources.json

      - name: Install Flatpak lint tools
        if: github.event_name == 'release' || inputs.lint
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.flatpak.Builder

      - name: Lint Flatpak manifest
        if: github.event_name == 'release' || inputs.lint
        run: |
          flatpak run --user --command=flatpak-builder-lint org.flatpak.Builder manifest flatpak-repo/org.astian.midori_browser.yml

      - name: Lint Flatpak appstream
        if: github.event_name == 'release' || inputs.lint
        run: |
          flatpak run --user --command=flatpak-builder-lint org.flatpak.Builder appstream flatpak-repo/org.astian.midori_browser.metainfo.xml

      - name: Commit and push packaging update
        run: |
          cd flatpak-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git diff --cached --quiet && exit 0

          git commit -m "Update Flatpak packaging for Midori Browser ${{ steps.meta.outputs.version }}"
          git push origin main
