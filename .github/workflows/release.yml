name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      display_version:
        description: "Display version (e.g. 12.0)"
        required: true
        type: string
      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - release
          - dawn
        default: release
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: true
      deploy_updates:
        description: "Deploy updates to update server after release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Resolve version from tag or input
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      display_version: ${{ steps.version.outputs.display_version }}
      build_type: ${{ steps.version.outputs.build_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
            DISPLAY_VERSION=$(jq -r '.brands.release.release.displayVersion' amelia.json)
            echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
            echo "build_type=release" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.display_version }}" >> "$GITHUB_OUTPUT"
            echo "display_version=${{ inputs.display_version }}" >> "$GITHUB_OUTPUT"
            echo "build_type=${{ inputs.build_type }}" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Trigger the full build matrix
  # ---------------------------------------------------------------------------
  build:
    name: Build All Platforms
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      display_version: ${{ needs.prepare.outputs.display_version }}
      build_type: ${{ needs.prepare.outputs.build_type }}
      use_sccache: true
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Create GitHub Release with all artifacts
  # ---------------------------------------------------------------------------
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [ prepare, build ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Organize and generate checksums
        run: |
          mkdir -p release-output

          # Collect all distributable files
          find release-artifacts/ -type f \( \
            -name "*.tar.xz" -o \
            -name "*.dmg" -o \
            -name "*.exe" -o \
            -name "*.mar" \
          \) | while read -r file; do
            PLATFORM=$(echo "$file" | cut -d'/' -f2)
            FILENAME=$(basename "$file")
            case "$FILENAME" in
              *.source.tar.xz) continue ;;
            esac
            TARGET="release-output/midori-${{ needs.prepare.outputs.display_version }}-${PLATFORM}-${FILENAME}"
            cp "$file" "$TARGET"
          done

          # Collect update manifests
          mkdir -p release-output/update-manifests
          find release-artifacts/ -path "*/update/*" -type f | while read -r file; do
            PLATFORM=$(echo "$file" | cut -d'/' -f2)
            mkdir -p "release-output/update-manifests/${PLATFORM}"
            cp "$file" "release-output/update-manifests/${PLATFORM}/"
          done

          # Collect the source bundle consumed by the Flatpak build manifest
          SOURCE_BUNDLE=$(find release-artifacts/ -type f -name "*.source.tar.xz" | head -1)
          test -n "$SOURCE_BUNDLE"
          cp "$SOURCE_BUNDLE" "release-output/midori-${{ needs.prepare.outputs.display_version }}.source.tar.xz"

          # Generate SHA256 checksums
          cd release-output
          sha256sum midori-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.prepare.outputs.version }}"
          TITLE="Midori Browser v${{ needs.prepare.outputs.display_version }}"

          FLAGS="--generate-notes"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.draft }}" = "true" ]; then
            FLAGS="$FLAGS --draft"
          fi

          if [ "${{ needs.prepare.outputs.build_type }}" = "dawn" ]; then
            FLAGS="$FLAGS --prerelease"
          fi

          FILES=""
          for f in release-output/midori-* release-output/SHA256SUMS.txt; do
            [ -f "$f" ] && FILES="$FILES $f"
          done

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" $FILES \
              --title "$TITLE" \
              --repo "${{ github.repository }}" \
              $FLAGS
          fi

  # ---------------------------------------------------------------------------
  # Deploy updates to update server (optional)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy Updates
    needs: [ prepare, publish ]
    if: always() && inputs.deploy_updates == true && needs.publish.result == 'success'
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      display_version: ${{ needs.prepare.outputs.display_version }}
      build_type: ${{ needs.prepare.outputs.build_type }}
      dry_run: false
    secrets: inherit
