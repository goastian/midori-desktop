name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      display_version:
        description: "Display version (e.g. 12.0)"
        required: true
        type: string
      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - release
          - dawn
        default: release
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: true
      deploy_updates:
        description: "Deploy updates to update server after release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Resolve version from tag or input
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      display_version: ${{ steps.version.outputs.display_version }}
      build_type: ${{ steps.version.outputs.build_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
            # Read display version from amelia.json
            DISPLAY_VERSION=$(jq -r '.brands.release.release.displayVersion' amelia.json)
            echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
            echo "build_type=release" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.display_version }}" >> "$GITHUB_OUTPUT"
            echo "display_version=${{ inputs.display_version }}" >> "$GITHUB_OUTPUT"
            echo "build_type=${{ inputs.build_type }}" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Trigger the full build matrix
  # ---------------------------------------------------------------------------
  build:
    name: Build All Platforms
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      display_version: ${{ needs.prepare.outputs.display_version }}
      build_type: ${{ needs.prepare.outputs.build_type }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Create GitHub Release with all artifacts
  # ---------------------------------------------------------------------------
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [prepare, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Organize and generate checksums
        run: |
          mkdir -p release-output

          # Collect all distributable files
          find release-artifacts/ -type f \( \
            -name "*.tar.xz" -o \
            -name "*.dmg" -o \
            -name "*.exe" -o \
            -name "*.mar" \
          \) | while read -r file; do
            # Prefix with platform name from parent directory
            PLATFORM=$(basename "$(dirname "$file")")
            FILENAME=$(basename "$file")
            TARGET="release-output/midori-${{ needs.prepare.outputs.display_version }}-${PLATFORM}-${FILENAME}"
            cp "$file" "$TARGET"
          done

          # Collect update manifests
          mkdir -p release-output/update-manifests
          find release-artifacts/ -path "*/update/*" -type f | while read -r file; do
            PLATFORM=$(echo "$file" | cut -d'/' -f2)
            mkdir -p "release-output/update-manifests/${PLATFORM}"
            cp "$file" "release-output/update-manifests/${PLATFORM}/"
          done

          # Generate SHA256 checksums
          cd release-output
          sha256sum midori-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Prepare Flatpak release manifest
        run: |
          LINUX_X86=$(find release-output/ -name "*linux-x86_64*.tar.xz" | head -1)
          LINUX_AARCH64=$(find release-output/ -name "*linux-aarch64*.tar.xz" | head -1)

          if [ -n "$LINUX_X86" ] && [ -n "$LINUX_AARCH64" ]; then
            # Create a dummy flatpak archive for now (metadata placeholder)
            tar cf release-output/flatpak-archive.tar -T /dev/null

            python3 scripts/prepare-flatpak-release.py \
              --version "${{ needs.prepare.outputs.display_version }}" \
              --linux-archive "$LINUX_X86" \
              --linux-aarch64-archive "$LINUX_AARCH64" \
              --flatpak-archive release-output/flatpak-archive.tar \
              --output release-output/org.astian.midori.yml \
              --template-root build/flatpak
            echo "Flatpak manifest generated"
          else
            echo "Skipping Flatpak manifest — missing Linux archives"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.prepare.outputs.version }}"
          TITLE="Midori Browser v${{ needs.prepare.outputs.display_version }}"

          FLAGS="--generate-notes"

          # Draft flag
          if [ "${{ github.event.inputs.draft }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            FLAGS="$FLAGS --draft"
          fi

          # Prerelease flag
          if [ "${{ needs.prepare.outputs.build_type }}" = "dawn" ]; then
            FLAGS="$FLAGS --prerelease"
          fi

          # Create tag if it doesn't exist yet (workflow_dispatch case)
          git tag "$TAG" 2>/dev/null || true

          # Collect files to upload
          FILES=""
          for f in release-output/midori-* release-output/SHA256SUMS.txt; do
            [ -f "$f" ] && FILES="$FILES $f"
          done
          [ -f "release-output/org.astian.midori.yml" ] && FILES="$FILES release-output/org.astian.midori.yml"

          gh release create "$TAG" $FILES \
            --title "$TITLE" \
            --repo "${{ github.repository }}" \
            $FLAGS

  # ---------------------------------------------------------------------------
  # Deploy updates to update server (optional)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy Updates
    needs: [prepare, publish]
    if: inputs.deploy_updates == true
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      display_version: ${{ needs.prepare.outputs.display_version }}
      build_type: ${{ needs.prepare.outputs.build_type }}
      dry_run: false
    secrets: inherit
