name: Update Firefox Upstream

on:
  schedule:
    # Every day at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      check_rc:
        description: "Check for Release Candidate too"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    name: Check for Firefox Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install npm dependencies
        run: npm ci

      - name: Store current version
        id: before
        run: |
          VERSION=$(jq -r '.version.version' amelia.json)
          RC_VERSION=$(jq -r '.version.candidate' amelia.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "rc_version=$RC_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Firefox version
        run: |
          if [ "${{ inputs.check_rc }}" = "true" ]; then
            npm run update-ff:rc
          else
            npm run update-ff
          fi

      - name: Check for changes
        id: changes
        run: |
          NEW_VERSION=$(jq -r '.version.version' amelia.json)
          NEW_RC=$(jq -r '.version.candidate' amelia.json)
          if [ "$NEW_VERSION" != "${{ steps.before.outputs.version }}" ] || \
             [ "$NEW_RC" != "${{ steps.before.outputs.rc_version }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "new_rc=$NEW_RC" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR if updated
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="automation/firefox-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore(upstream): update Firefox to ${{ steps.changes.outputs.new_version }}"
          git push -f origin "$BRANCH"

          # Create or update PR
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "PR #$EXISTING_PR already exists, updated branch."
          else
            gh pr create \
              --title "chore(upstream): update Firefox to ${{ steps.changes.outputs.new_version }}" \
              --body "Automated Firefox upstream update detected.

          - **Previous version:** ${{ steps.before.outputs.version }}
          - **New version:** ${{ steps.changes.outputs.new_version }}
          - **RC version:** ${{ steps.changes.outputs.new_rc }}

          This PR was generated automatically by the Update Firefox Upstream workflow.
          Please review and test before merging." \
              --head "$BRANCH" \
              --label "upstream,automated" || true
          fi
