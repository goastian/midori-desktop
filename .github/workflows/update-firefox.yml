name: Update Firefox Upstream

on:
  schedule:
    # Every day at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      check_rc:
        description: "Check for Release Candidate too"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    name: Check for Firefox Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install npm dependencies
        run: npm ci

      - name: Store current version
        id: before
        run: |
          VERSION=$(jq -r '.version.version' amelia.json)
          RC_VERSION=$(jq -r '.version.candidate' amelia.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "rc_version=$RC_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Firefox version
        run: |
          if [ "${{ inputs.check_rc }}" = "true" ]; then
            npm run update-ff:rc
          else
            npm run update-ff
          fi

      - name: Check for changes
        id: changes
        run: |
          NEW_VERSION=$(jq -r '.version.version' amelia.json)
          NEW_RC=$(jq -r '.version.candidate' amelia.json)
          if [ "$NEW_VERSION" != "${{ steps.before.outputs.version }}" ] || \
             [ "$NEW_RC" != "${{ steps.before.outputs.rc_version }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "new_rc=$NEW_RC" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR if updated
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(upstream): update Firefox to ${{ steps.changes.outputs.new_version }}"
          title: "chore(upstream): update Firefox to ${{ steps.changes.outputs.new_version }}"
          body: |
            Automated Firefox upstream update detected.

            - **Previous version:** ${{ steps.before.outputs.version }}
            - **New version:** ${{ steps.changes.outputs.new_version }}
            - **RC version:** ${{ steps.changes.outputs.new_rc }}

            This PR was generated automatically by the Update Firefox Upstream workflow.
            Please review and test before merging.
          branch: automation/firefox-update
          delete-branch: true
          labels: upstream,automated
