name: Build

on:
  workflow_dispatch:
    inputs:
      display_version:
        description: "Display version for the build (e.g. 12.0)"
        required: true
        type: string
      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - release
          - dawn
        default: release
      platforms:
        description: "Platforms to build"
        required: true
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
        default: all
  workflow_call:
    inputs:
      display_version:
        required: true
        type: string
      build_type:
        required: false
        type: string
        default: release
      platforms:
        required: false
        type: string
        default: all

concurrency:
  group: build-${{ github.ref }}-${{ inputs.build_type }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Linux builds
  # ---------------------------------------------------------------------------
  build-linux:
    name: Linux
    if: inputs.platforms == 'all' || inputs.platforms == 'linux'
    uses: ./.github/workflows/build-linux.yml
    with:
      display_version: ${{ inputs.display_version }}
      build_type: ${{ inputs.build_type }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # macOS builds
  # ---------------------------------------------------------------------------
  build-macos:
    name: macOS
    if: inputs.platforms == 'all' || inputs.platforms == 'macos'
    uses: ./.github/workflows/build-macos.yml
    with:
      display_version: ${{ inputs.display_version }}
      build_type: ${{ inputs.build_type }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Windows builds (cross-compiled from Linux)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows
    if: inputs.platforms == 'all' || inputs.platforms == 'windows'
    uses: ./.github/workflows/build-windows.yml
    with:
      display_version: ${{ inputs.display_version }}
      build_type: ${{ inputs.build_type }}
    secrets: inherit
