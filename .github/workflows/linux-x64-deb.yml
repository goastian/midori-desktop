name: "(d) 📦 linux x86_64 deb(-ppa) pack"

on:
  workflow_dispatch:
    inputs:
      tarball-url-x86-64:
        type: string
        required: true
        description: URL of target tarball file (x86_64)
      ppa:
        type: boolean
        required: true
        description: Do upload deb to ppa

jobs:
  build:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        runs-on: ['ubuntu-latest']

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v4

    - name: Change PPA mirror servers
      run: |
        sudo perl -p -i -e 's%(deb(?:-src|)\s+)https?://(?!archive\.canonical\.com|security\.ubuntu\.com)[^\s]+%$1http://archive.ubuntu.com/ubuntu/%' /etc/apt/sources.list
        sudo apt update

    - name: download Artifact 📦
      run: |
        mkdir -p /home/runner/artifact
        wget -P /home/runner/artifact ${{ inputs.tarball-url-x86-64 }}

    - name: Package 📦
      run: |
        export WORKDIR=`pwd`
        export DISPVER=`cat browser/config/version_display.txt`
        export VER=`cat browser/config/version.txt`
        export DEBWORK=$WORKDIR/midori-$DISPVER
        mkdir -p $DEBWORK/usr/lib/
        cd $DEBWORK/usr/lib/
        mkdir -p midori/distribution/extensions
        mkdir midori/extensions
        mkdir midori/plugins
        cp /home/runner/artifact/*.tar.bz2 $WORKDIR/midori-$DISPVER.en-US.linux-x86_64.tar.bz2
        tar -xjvf $WORKDIR/midori-$DISPVER.en-US.linux-x86_64.tar.bz2
        cd ..
        mkdir bin
        cd bin
        ln -s ../lib/midori/midori.sh midori
        cd ..
        mkdir -p share/applications
        cp $WORKDIR/.github/midori-debian.desktop share/applications/midori.desktop
        cd $DEBWORK
        cd ../
        inst_size=$(du -ks midori-$DISPVER|awk '{print $1}')
        cd $DEBWORK
        mkdir DEBIAN
        cd DEBIAN
        echo -e "Package: midori\\nVersion: $DISPVER\\nArchitecture: amd64\\nMaintainer: Midori Browser\\nInstalled-Size: ${inst_size}\\nDepends: libasound2 (>= 1.0.16), libatk1.0-0 (>= 1.12.4), libc6 (>= 2.18), libcairo-gobject2 (>= 1.10.0), libcairo2 (>= 1.10.0), libdbus-1-3 (>= 1.5.12), libfontconfig1 (>= 2.11), libfreetype6 (>= 2.3.5), libgcc1 (>= 1:4.1.1), libgdk-pixbuf2.0-0 (>= 2.22.0), libglib2.0-0 (>= 2.37.0), libgtk-3-0 (>= 3.13.7), libpango-1.0-0 (>= 1.14.0), libpangocairo-1.0-0 (>= 1.14.0), libstdc++6 (>= 4.8), libx11-6, libx11-xcb1, libxcb-shm0, libxcb1, libxcomposite1 (>= 1:0.3-1), libxcursor1 (>> 1.1.2), libxdamage1 (>= 1:1.1), libxext6, libxfixes3, libxi6, libxrandr2 (>= 2:1.4.0), libxrender1, fonts-noto-cjk\\nRecommends: libavcodec60 | libavcodec-extra60 | libavcodec59 | libavcodec-extra59 | libavcodec58 | libavcodec-extra58 | libavcodec57 | libavcodec-extra57 | libavcodec56 | libavcodec-extra56 | libavcodec55 | libavcodec-extra55 | libavcodec54 | libavcodec-extra54 | libavcodec53 | libavcodec-extra53\\nSuggests: fonts-stix | otf-stix, fonts-lmodern, libgssapi-krb5-2 | libkrb53, libcanberra0, pulseaudio\\nProvides: gnome-www-browser, www-browser\\nSection: web\\nPriority: optional\\nDescription: Midori is a fast and secure lightweight browser,\\n privacy-preserving browser \\nXul-Appid: {ec8030f7-c20a-464f-9b0e-13a3a9e97384}" > control
        cd $DEBWORK
        unzip $WORKDIR/.github/debian-data-ppa.zip
        find $DEBWORK -type f -print0 | xargs -0 chmod 644
        find $DEBWORK -type d -print0 | xargs -0 chmod +x
        cd DEBIAN
        chmod +x postinst postrm preinst prerm
        cd ../usr/lib/midori
        chmod +x midori midori-bin glxtest vaapitest midori.sh lib*.so gmp-clearkey/0.1/libclearkey.so
        sudo chown -R root:root $DEBWORK
        cd $WORKDIR
        sudo dpkg-deb -b $DEBWORK

    - name: Compress artifacts 🤖
      run: |
        export WORKDIR=`pwd`
        export DISPVER=`cat browser/config/version_display.txt`
        export DEBWORK=$WORKDIR/midori-$DISPVER
        sudo touch midori-$DISPVER.deb
        sudo chmod +r midori-$DISPVER.deb
        zip -r dist.zip midori-$DISPVER.deb

    - name: Update PPA 👻
      if: inputs.ppa
      run: |
        echo "::add-mask::${{ secrets.KEYMASK }}"
        export DISPVER=`cat browser/config/version_display.txt`
        mkdir publish
        echo "${{ secrets.GPG_SEC }}" > Midori_sec.asc
        gpg --import Midori_sec.asc
        echo "${{ secrets.FTP_INIT_SCRIPT }}" > init_script.txt
        echo "${{ secrets.FTP_FINISH_SCRIPT }}" > finish_script.txt
        cd publish
        ftp -n -p < ../init_script.txt
        cp ../midori-$DISPVER.deb ./
        dpkg-scanpackages --multiversion . > Packages
        gzip -k -f Packages
        apt-ftparchive release . > Release
        gpg --default-key "${{ secrets.GPG_SSB }}" -abs -o - Release > Release.gpg
        gpg --default-key "${{ secrets.GPG_SSB }}" --clearsign -o - Release > InRelease
        ftp -n -p < ../finish_script.txt
        cd ../
        rm init_script.txt finish_script.txt Midori_sec.asc

    - name: Publish 🎁
      uses: actions/upload-artifact@v4
      with:
        name: midori-debian-amd64
        path: dist.zip

