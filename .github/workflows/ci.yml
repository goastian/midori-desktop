name: CI

on:
  push:
    branches: [ main, dev, flatpak ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint & Prettier
        run: npm run lint

      - name: License check
        run: npm run lc

  build-check:
    name: Build Check (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs: lint
    env:
      SURFER_COMPAT: x86_64
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: 0
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/share/swift /usr/local/.ghcup || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Setup sccache
        run: |
          SCCACHE_VERSION="v0.8.1"
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo mv sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache /usr/local/bin/
          mkdir -p "$SCCACHE_DIR"
          sccache --version

      - name: Restore sccache cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/sccache
          key: sccache-ci-x86_64-${{ github.sha }}
          restore-keys: |
            sccache-ci-x86_64-

      - name: Setup Rust
        run: |
          if [ -f .rust-toolchain ]; then
            RUST_VERSION=$(cat .rust-toolchain)
          else
            RUST_VERSION="1.83"
          fi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain "$RUST_VERSION"
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version

      - name: Install cbindgen
        run: |
          . "$HOME/.cargo/env"
          if ! command -v cbindgen >/dev/null 2>&1 || ! cbindgen --version | grep -q '0.29.1'; then
            cargo install cbindgen --version 0.29.1 --locked
          fi
          cbindgen --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libdbus-glib-1-dev \
            libxt-dev \
            libasound2-dev \
            libpulse-dev \
            libpython3-dev \
            libdrm-dev \
            libcurl4-openssl-dev \
            libx11-xcb-dev \
            nasm \
            yasm \
            clang \
            lld \
            llvm \
            xvfb

      - name: Install npm dependencies
        run: npm ci

      - name: Apply Amelia patches
        run: bash scripts/patch-amelia.sh

      - name: Debug Amelia branding patch
        run: |
          echo '--- branding-patch.js after patch ---'
          head -40 node_modules/@goastian/amelia/dist/commands/patches/branding-patch.js || tail -40 node_modules/@goastian/amelia/dist/commands/patches/branding-patch.js
          echo '--- END ---'

      - name: Initialize Amelia (download + import + bootstrap)
        run: npm run init

      - name: Build check (dev mode)
        run: |
          . "$HOME/.cargo/env"
          npm run build
