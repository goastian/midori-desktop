name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint & Prettier
        run: npm run lint

      - name: License check
        run: npm run lc

  bootstrap-smoke:
    name: Bootstrap Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: lint
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/share/swift /usr/local/.ghcup || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Resolve display version
        id: version
        run: |
          VERSION="$(python3 -c "import json; print(json.load(open('package.json', 'r', encoding='utf-8'))['version'])")"
          echo "display_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        run: |
          if [ -f .rust-toolchain ]; then
            RUST_VERSION=$(cat .rust-toolchain)
          else
            RUST_VERSION="1.83"
          fi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain "$RUST_VERSION"
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libdbus-glib-1-dev \
            libxt-dev \
            libasound2-dev \
            libpulse-dev \
            libpython3-dev \
            libdrm-dev \
            libcurl4-openssl-dev \
            libx11-xcb-dev \
            nasm \
            yasm \
            clang \
            lld \
            llvm \
            xvfb

      - name: Install npm dependencies
        run: npm ci

      - name: Apply Amelia patches
        run: bash scripts/patch-amelia.sh

      - name: Set brand
        run: npm run brand

      - name: Activate CI configuration
        run: npm run ci -- --display-version ${{ steps.version.outputs.display_version }}

      - name: Create log directory
        run: mkdir -p .ci-logs

      - name: Download Firefox source
        run: |
          set -o pipefail
          npm run download 2>&1 | tee .ci-logs/download.log

      - name: Import patches
        run: |
          set -o pipefail
          npm run import 2>&1 | tee .ci-logs/import.log

      - name: Bootstrap
        run: |
          set -o pipefail
          npm run bootstrap 2>&1 | tee .ci-logs/bootstrap.log

      - name: Upload bootstrap smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-smoke-logs-${{ github.run_id }}
          path: .ci-logs/
          retention-days: 14
          if-no-files-found: warn
