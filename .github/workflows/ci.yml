name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Source unit tests
        run: npm run test:unit

      - name: ESLint & Prettier
        run: npm run lint

      - name: License check
        run: npm run lc

  build-metadata:
    name: Resolve Build Metadata
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      display_version: ${{ steps.version.outputs.display_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve display version
        id: version
        run: |
          DISPLAY_VERSION=$(jq -r '.brands.release.release.displayVersion' amelia.json)
          test -n "$DISPLAY_VERSION"
          test "$DISPLAY_VERSION" != "null"
          echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"

  prepare-source:
    name: Prepare Build Source
    needs: build-metadata
    uses: ./.github/workflows/prepare-source.yml
    with:
      display_version: ${{ needs.build-metadata.outputs.display_version }}
      build_type: release
      package_artifacts: ${{ github.event_name == 'push' }}
    secrets: inherit

  build-linux:
    needs: [build-metadata, prepare-source]
    uses: ./.github/workflows/build-linux.yml
    with:
      display_version: ${{ needs.build-metadata.outputs.display_version }}
      build_type: release
      use_sccache: true
      package_artifacts: ${{ github.event_name == 'push' }}
    secrets: inherit

  build-macos:
    needs: [build-metadata, prepare-source]
    uses: ./.github/workflows/build-macos.yml
    with:
      display_version: ${{ needs.build-metadata.outputs.display_version }}
      build_type: release
      use_sccache: true
      package_artifacts: ${{ github.event_name == 'push' }}
    secrets: inherit

  build-windows:
    needs: [build-metadata, prepare-source]
    uses: ./.github/workflows/build-windows.yml
    with:
      display_version: ${{ needs.build-metadata.outputs.display_version }}
      build_type: release
      use_sccache: true
      package_artifacts: ${{ github.event_name == 'push' }}
    secrets: inherit
