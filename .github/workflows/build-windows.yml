name: Build Windows

on:
  workflow_call:
    inputs:
      display_version:
        required: true
        type: string
      build_type:
        required: false
        type: string
        default: release
      build_id:
        required: false
        type: string
        default: ""
      use_sccache:
        required: false
        type: boolean
        default: true

jobs:
  windows-build:
    name: Windows ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      MIDORI_RELEASE: "true"
      MIDORI_RELEASE_BRANCH: ${{ inputs.build_type }}
      AMELIA_COMPAT: ${{ matrix.arch }}
      SURFER_COMPAT: ${{ matrix.arch }}
      MIDORI_CROSS_COMPILING: "true"
      SCCACHE_GHA_ENABLED: ${{ inputs.use_sccache && 'true' || 'false' }}
      RUSTC_WRAPPER: ${{ inputs.use_sccache && 'sccache' || '' }}
      CARGO_INCREMENTAL: 0

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main
        if: ${{ inputs.use_sccache }}
        with:
          disable_annotations: true

      - name: Expose actions cache variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libdbus-glib-1-dev \
            libxt-dev \
            libpython3-dev \
            libdrm-dev \
            libcurl4-openssl-dev \
            libx11-xcb-dev \
            nasm \
            yasm \
            clang \
            lld \
            llvm \
            msitools \
            dos2unix \
            xvfb

      - name: Restore win-cross cache
        id: cache-win-cross
        uses: actions/cache@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5
        with:
          path: ~/win-cross
          key: win-cross-${{ runner.os }}

      - name: Setup Windows cross-compilation environment
        if: steps.cache-win-cross.outputs.cache-hit != 'true'
        run: |
          set -x
          mkdir -p ~/win-cross
          sudo apt-get install -y \
            python3-pip \
            autoconf \
            automake \
            cmake \
            ninja-build \
            p7zip-full \
            zip \
            aria2
          cd engine/
          # Download wine for cross-compilation
          aria2c "https://firefox-ci-tc.services.mozilla.com/api/index/v1/task/gecko.cache.level-1.toolchains.v3.linux64-wine.latest/artifacts/public%2Fbuild%2Fwine.tar.zst" -o wine.tar.zst || true
          if [ -f wine.tar.zst ]; then
            tar --zstd -xf wine.tar.zst -C ~/win-cross
            rm wine.tar.zst
          fi
          cd ..

      - name: Setup Rust
        run: |
          if [ -f .rust-toolchain ]; then
            RUST_VERSION=$(cat .rust-toolchain)
          else
            RUST_VERSION="1.83"
          fi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain "$RUST_VERSION"
          . "$HOME/.cargo/env"
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            rustup target add aarch64-pc-windows-msvc
          else
            rustup target add x86_64-pc-windows-msvc
          fi
          rustc --version

      - name: Install npm dependencies
        run: npm ci

      - name: Set brand
        run: npm run brand

      - name: Activate CI configuration
        run: npm run ci -- --display-version ${{ inputs.display_version }}

      - name: Download prepared source
        uses: actions/download-artifact@v4
        with:
          name: midori.source.tar.zst

      - name: Extract prepared source
        run: |
          mkdir -p engine
          tar --use-compress-program=zstd -xf midori.source.tar.zst -C engine
          rm midori.source.tar.zst

      - name: Bootstrap
        run: |
          export SURFER_PLATFORM="win32"
          export MIDORI_CROSS_COMPILING=1
          npm run bootstrap
          if [ -d ~/win-cross/wine ]; then
            ls ~/win-cross/wine
          fi

      - name: Build
        env:
          SURFER_PLATFORM: win32
        run: |
          . "$HOME/.cargo/env"
          dos2unix configs/windows/mozconfig 2>/dev/null || true
          export MIDORI_CROSS_COMPILING=1
          export MIDORI_RELEASE=1
          if [ -n "${{ inputs.build_id }}" ]; then
            export MOZ_BUILD_DATE="${{ inputs.build_id }}"
          fi
          npm run build

      - name: Package
        env:
          SURFER_PLATFORM: win32
        run: |
          export MIDORI_CROSS_COMPILING=1
          export MIDORI_RELEASE=1
          npm run package -- --verbose

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.mar
            dist/update/
          retention-days: 5
