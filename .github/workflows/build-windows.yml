name: Build Windows

on:
  workflow_call:
    inputs:
      display_version:
        required: true
        type: string
      build_type:
        required: false
        type: string
        default: release
      build_id:
        required: false
        type: string
        default: ''
      use_sccache:
        required: false
        type: boolean
        default: true
      package_artifacts:
        required: false
        type: boolean
        default: true
      source_is_prepared:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      display_version:
        required: true
        type: string
      build_type:
        required: true
        type: choice
        options: [release, dawn]
        default: release
      package_artifacts:
        required: true
        type: boolean
        default: true
      use_sccache:
        required: true
        type: boolean
        default: true
jobs:
  prepare-source:
    if: ${{ github.event_name == 'workflow_dispatch' || !inputs.source_is_prepared }}
    uses: ./.github/workflows/prepare-source.yml
    with:
      display_version: ${{ inputs.display_version }}
      build_type: ${{ inputs.build_type }}
      package_artifacts: ${{ inputs.package_artifacts }}
    secrets: inherit

  windows-build:
    name: Windows ${{ matrix.arch }}
    needs: prepare-source
    if: ${{ always() && (needs.prepare-source.result == 'success' || (github.event_name != 'workflow_dispatch' && inputs.source_is_prepared)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      MIDORI_RELEASE: 'true'
      MIDORI_RELEASE_BRANCH: ${{ inputs.build_type }}
      AMELIA_COMPAT: ${{ matrix.arch }}
      SURFER_COMPAT: ${{ matrix.arch }}
      MIDORI_CROSS_COMPILING: 'true'
      RUSTC_WRAPPER: ${{ inputs.use_sccache && 'sccache' || '' }}
      CARGO_INCREMENTAL: 0

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/share/swift /usr/local/.ghcup || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          df -h

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Setup sccache
        if: ${{ inputs.use_sccache }}
        run: |
          SCCACHE_VERSION="v0.17.0"
          SCCACHE_ARCH="x86_64-unknown-linux-musl"
          SCCACHE_ARCHIVE="sccache-${SCCACHE_VERSION}-${SCCACHE_ARCH}.tar.gz"
          SCCACHE_URL="https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/${SCCACHE_ARCHIVE}"
          curl --fail --location --retry 5 --retry-all-errors --output "$SCCACHE_ARCHIVE" "$SCCACHE_URL"
          curl --fail --location --retry 5 --retry-all-errors --output "$SCCACHE_ARCHIVE.sha256" "$SCCACHE_URL.sha256"
          echo "$(cat "$SCCACHE_ARCHIVE.sha256")  $SCCACHE_ARCHIVE" | sha256sum --check -
          tar -xzf "$SCCACHE_ARCHIVE"
          sudo install -m 0755 "sccache-${SCCACHE_VERSION}-${SCCACHE_ARCH}/sccache" /usr/local/bin/sccache
          sccache --version

      - name: Configure sccache GitHub credentials
        if: ${{ inputs.use_sccache }}
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')

      - name: Enable incremental sccache backend
        if: ${{ inputs.use_sccache }}
        run: |
          echo "SCCACHE_GHA_ENABLED=on" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_VERSION=midori-windows-${{ matrix.arch }}" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libdbus-glib-1-dev \
            libxt-dev \
            libpython3-dev \
            libdrm-dev \
            libcurl4-openssl-dev \
            libx11-xcb-dev \
            nasm \
            yasm \
            clang \
            lld \
            llvm \
            msitools \
            dos2unix \
            wine64 \
            xvfb

      - name: Restore Windows toolchains
        uses: actions/cache@v6
        with:
          path: ~/.mozbuild
          key: windows-toolchains-${{ runner.os }}-${{ hashFiles('amelia.json', 'scripts/setup-winsysroot.sh') }}
          restore-keys: |
            windows-toolchains-${{ runner.os }}-

      - name: Setup Rust
        run: |
          if [ -f .rust-toolchain ]; then
            RUST_VERSION=$(cat .rust-toolchain)
          else
            RUST_VERSION="1.83"
          fi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain "$RUST_VERSION"
          . "$HOME/.cargo/env"
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            rustup target add aarch64-pc-windows-msvc
          else
            rustup target add x86_64-pc-windows-msvc
          fi
          rustc --version

      - name: Install npm dependencies
        run: npm ci

      - name: Set brand
        run: npm run brand

      - name: Activate CI configuration
        run: npm run ci -- --display-version ${{ inputs.display_version }}

      - name: Download prepared source
        uses: actions/download-artifact@v8
        with:
          name: midori.source.tar.zst

      - name: Extract prepared source
        run: |
          mkdir -p engine
          tar --use-compress-program=zstd -xf midori.source.tar.zst -C engine
          rm midori.source.tar.zst

      - name: Bootstrap
        run: |
          export AMELIA_PLATFORM="win32"
          export MIDORI_CROSS_COMPILING=1
          npm run bootstrap

      - name: Setup Windows cross-compilation toolchains
        run: npm run setup:windows

      - name: Build
        env:
          AMELIA_PLATFORM: win32
        run: |
          . "$HOME/.cargo/env"
          dos2unix configs/windows/mozconfig 2>/dev/null || true
          export MIDORI_CROSS_COMPILING=1
          export MIDORI_RELEASE=1
          if [ -n "${{ inputs.build_id }}" ]; then
            export MOZ_BUILD_DATE="${{ inputs.build_id }}"
          fi
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            npm run build:win-arm64 -- --skip-patch-check
          else
            npm run build:win-x64 -- --skip-patch-check
          fi

      - name: Report sccache statistics
        if: ${{ always() && inputs.use_sccache }}
        run: sccache --show-stats || true

      - name: Verify compiled output
        run: bash scripts/verify-build-output.sh windows "${{ matrix.arch }}"

      - name: Package
        if: ${{ inputs.package_artifacts }}
        env:
          AMELIA_PLATFORM: win32
        run: |
          export MIDORI_CROSS_COMPILING=1
          export MIDORI_RELEASE=1
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            npm run package:win-arm64 -- --verbose
          else
            npm run package:win-x64 -- --verbose
          fi

      - name: Summarize Windows packages
        if: ${{ inputs.package_artifacts }}
        run: |
          files="$(find dist -type f \( -name '*.exe' -o -name '*.mar' -o -path '*/update/*' \) -print | sort)"
          test -n "$files"
          {
            echo "### Windows ${{ matrix.arch }} packages"
            echo
            echo "Artifact: \`windows-${{ matrix.arch }}\`"
            echo
            echo '| File | Format | Size | SHA-256 |'
            echo '| --- | --- | ---: | --- |'
            while IFS= read -r file; do
              name="${file#dist/}"
              case "$name" in
                *.*) format="${name##*.}" ;;
                *) format='file' ;;
              esac
              size="$(du -h "$file" | cut -f1)"
              digest="$(sha256sum "$file" | cut -d' ' -f1)"
              printf '| `%s` | `%s` | %s | `%s` |\n' "$name" "$format" "$size" "$digest"
            done <<< "$files"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: ${{ inputs.package_artifacts }}
        id: upload-windows-artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.mar
            dist/update/
          retention-days: 5
          if-no-files-found: error

      - name: Publish Windows artifact link
        if: ${{ inputs.package_artifacts }}
        env:
          ARTIFACT_URL: ${{ steps.upload-windows-artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload-windows-artifact.outputs.artifact-digest }}
        run: |
          {
            echo
            echo "[Download Windows ${{ matrix.arch }} artifact]($ARTIFACT_URL)"
            echo
            echo "Artifact archive SHA-256: \`$ARTIFACT_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
