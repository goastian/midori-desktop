name: Build Linux

on:
  workflow_call:
    inputs:
      display_version:
        required: true
        type: string
      build_type:
        required: false
        type: string
        default: release

env:
  MIDORI_RELEASE: "true"
  MIDORI_RELEASE_BRANCH: ${{ inputs.build_type }}
  SCCACHE_GHA_ENABLED: "true"

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    env:
      SURFER_COMPAT: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo swapoff -a && sudo rm -f /swapfile || true
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Setup Rust
        run: |
          rustup toolchain install 1.83 --profile minimal
          rustup default 1.83
          rustc --version

      - name: Setup sccache
        run: |
          SCCACHE_VERSION="v0.8.1"
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo mv sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache /usr/local/bin/
          sccache --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libdbus-glib-1-dev \
            libxt-dev \
            libasound2-dev \
            libpulse-dev \
            nasm \
            yasm \
            clang \
            lld

      - name: Install npm dependencies
        run: npm ci

      - name: Initialize (download + import + bootstrap)
        run: npm run init

      - name: Download language packs
        run: bash scripts/download-language-packs.sh

      - name: Build release
        run: npm run ci -- ${{ inputs.display_version }}

      - name: Package
        run: npm run package -- --verbose

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist/*.tar.xz
            dist/*.mar
            dist/update/
          retention-days: 5

  linux-aarch64:
    name: Linux aarch64
    runs-on: ubuntu-latest
    env:
      SURFER_COMPAT: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo swapoff -a && sudo rm -f /swapfile || true
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Setup Rust
        run: |
          rustup toolchain install 1.83 --profile minimal
          rustup default 1.83
          rustup target add aarch64-unknown-linux-gnu
          rustc --version

      - name: Setup sccache
        run: |
          SCCACHE_VERSION="v0.8.1"
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo mv sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache /usr/local/bin/
          sccache --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libdbus-glib-1-dev \
            libxt-dev \
            libasound2-dev \
            libpulse-dev \
            nasm \
            yasm \
            clang \
            lld \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Install npm dependencies
        run: npm ci

      - name: Initialize (download + import + bootstrap)
        run: npm run init

      - name: Download language packs
        run: bash scripts/download-language-packs.sh

      - name: Build release
        run: npm run ci -- ${{ inputs.display_version }}

      - name: Package
        run: npm run package -- --verbose

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: |
            dist/*.tar.xz
            dist/*.mar
            dist/update/
          retention-days: 5
