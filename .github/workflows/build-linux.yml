name: Build Linux

on:
  workflow_call:
    inputs:
      display_version:
        required: true
        type: string
      build_type:
        required: false
        type: string
        default: release
      build_id:
        required: false
        type: string
        default: ''
      use_sccache:
        required: false
        type: boolean
        default: true
      package_artifacts:
        required: false
        type: boolean
        default: true
      source_is_prepared:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      display_version:
        required: true
        type: string
      build_type:
        required: true
        type: choice
        options: [release, dawn]
        default: release
      package_artifacts:
        required: true
        type: boolean
        default: true
      use_sccache:
        required: true
        type: boolean
        default: true
      source_is_prepared:
        required: true
        type: boolean
        default: false

jobs:
  prepare-source:
    if: ${{ !inputs.source_is_prepared }}
    uses: ./.github/workflows/prepare-source.yml
    with:
      display_version: ${{ inputs.display_version }}
      build_type: ${{ inputs.build_type }}
      package_artifacts: ${{ inputs.package_artifacts }}
    secrets: inherit

  linux-build:
    name: Linux ${{ matrix.arch }}
    needs: prepare-source
    if: ${{ always() && (inputs.source_is_prepared || needs.prepare-source.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      MIDORI_RELEASE: 'true'
      MIDORI_RELEASE_BRANCH: ${{ inputs.build_type }}
      SURFER_COMPAT: ${{ matrix.arch }}
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      RUSTC_WRAPPER: ${{ inputs.use_sccache && 'sccache' || '' }}
      CARGO_INCREMENTAL: 0

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/share/swift /usr/local/.ghcup || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          df -h

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Setup sccache
        if: ${{ inputs.use_sccache }}
        run: |
          SCCACHE_VERSION="v0.17.0"
          SCCACHE_ARCH="x86_64-unknown-linux-musl"
          SCCACHE_ARCHIVE="sccache-${SCCACHE_VERSION}-${SCCACHE_ARCH}.tar.gz"
          SCCACHE_URL="https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/${SCCACHE_ARCHIVE}"
          curl --fail --location --retry 5 --retry-all-errors --output "$SCCACHE_ARCHIVE" "$SCCACHE_URL"
          curl --fail --location --retry 5 --retry-all-errors --output "$SCCACHE_ARCHIVE.sha256" "$SCCACHE_URL.sha256"
          echo "$(cat "$SCCACHE_ARCHIVE.sha256")  $SCCACHE_ARCHIVE" | sha256sum --check -
          tar -xzf "$SCCACHE_ARCHIVE"
          sudo install -m 0755 "sccache-${SCCACHE_VERSION}-${SCCACHE_ARCH}/sccache" /usr/local/bin/sccache
          mkdir -p "$SCCACHE_DIR"
          sccache --version

      - name: Restore sccache cache
        if: ${{ inputs.use_sccache }}
        uses: actions/cache@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-linux-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            sccache-linux-${{ matrix.arch }}-

      - name: Setup Rust
        run: |
          if [ -f .rust-toolchain ]; then
            RUST_VERSION=$(cat .rust-toolchain)
          else
            RUST_VERSION="1.83"
          fi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain "$RUST_VERSION"
          . "$HOME/.cargo/env"
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            rustup target add aarch64-unknown-linux-gnu
          fi
          rustc --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libdbus-glib-1-dev \
            libxt-dev \
            libasound2-dev \
            libpulse-dev \
            libpython3-dev \
            libdrm-dev \
            libcurl4-openssl-dev \
            libx11-xcb-dev \
            nasm \
            yasm \
            clang \
            lld \
            llvm \
            rpm \
            xvfb
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Set brand
        run: npm run brand

      - name: Activate CI configuration
        run: npm run ci -- --display-version ${{ inputs.display_version }}

      - name: Download prepared source
        uses: actions/download-artifact@v8
        with:
          name: midori.source.tar.zst

      - name: Extract prepared source
        run: |
          mkdir -p engine
          tar --use-compress-program=zstd -xf midori.source.tar.zst -C engine
          rm midori.source.tar.zst

      - name: Bootstrap
        run: npm run bootstrap

      - name: Setup Linux aarch64 toolchain
        if: matrix.arch == 'aarch64'
        run: npm run setup:linux-arm64

      - name: Build
        env:
          AMELIA_PLATFORM: linux
        run: |
          . "$HOME/.cargo/env"
          if [ -n "${{ inputs.build_id }}" ]; then
            export MOZ_BUILD_DATE="${{ inputs.build_id }}"
          fi
          export MIDORI_RELEASE=1
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            npm run build:linux-arm64 -- --skip-patch-check
          else
            npm run build:linux-x64 -- --skip-patch-check
          fi

      - name: Report sccache statistics
        if: ${{ always() && inputs.use_sccache }}
        run: sccache --show-stats || true

      - name: Verify compiled output
        run: bash scripts/verify-build-output.sh linux "${{ matrix.arch }}"

      - name: Package
        if: ${{ inputs.package_artifacts }}
        env:
          AMELIA_PLATFORM: linux
        run: |
          export MIDORI_RELEASE=1
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            npm run package:linux-arm64 -- --verbose
          else
            npm run package:linux-x64 -- --verbose
          fi

      - name: Build Debian and RPM packages
        if: ${{ inputs.package_artifacts }}
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            bash scripts/package-linux.sh aarch64 "${{ inputs.display_version }}"
          else
            bash scripts/package-linux.sh x86_64 "${{ inputs.display_version }}"
          fi

      - name: Upload artifacts
        if: ${{ inputs.package_artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.xz
            dist/*.deb
            dist/*.rpm
            dist/*.mar
            dist/update/
          retention-days: 5
          if-no-files-found: error
