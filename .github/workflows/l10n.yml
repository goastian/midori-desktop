name: Localization Sync

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-l10n:
    name: Sync Language Packs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install npm dependencies
        run: npm ci

      - name: Update l10n commit hash
        run: npm run update-ff:l10n

      - name: Download Firefox language packs
        run: python3 scripts/prepare_l10n.py --download-only --force

      - name: Sync Crowdin translations
        env:
          CROWDIN_PROJECT_ID: ${{ vars.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_TOKEN }}
        run: |
          if [ -z "$CROWDIN_PERSONAL_TOKEN" ]; then
            echo "No Crowdin token, skipping Crowdin sync."
            exit 0
          fi
          npm install -g @crowdin/cli
          crowdin upload sources --config crowdin.yml
          crowdin download --config crowdin.yml

      - name: Create PR if changes detected
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No l10n changes detected, skipping PR."
            exit 0
          fi

          BRANCH="automation/l10n-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore(l10n): update language packs from mozilla-l10n"
          git push -f origin "$BRANCH"

          # Create or update PR
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "PR #$EXISTING_PR already exists, updated branch."
          else
            gh pr create \
              --title "chore(l10n): update language packs" \
              --body "Automated update of Firefox language packs from [mozilla-l10n/firefox-l10n](https://github.com/mozilla-l10n/firefox-l10n).

          This PR was generated automatically by the Localization Sync workflow." \
              --head "$BRANCH" \
              --label "l10n,automated" || true
          fi
