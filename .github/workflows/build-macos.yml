name: Build macOS

on:
  workflow_call:
    inputs:
      display_version:
        required: true
        type: string
      build_type:
        required: false
        type: string
        default: release
      build_id:
        required: false
        type: string
        default: ""
      use_sccache:
        required: false
        type: boolean
        default: true
      package_artifacts:
        required: false
        type: boolean
        default: true
      source_is_prepared:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      display_version:
        required: true
        type: string
      build_type:
        required: true
        type: choice
        options: [release, dawn]
        default: release
      package_artifacts:
        required: true
        type: boolean
        default: true
      use_sccache:
        required: true
        type: boolean
        default: true
jobs:
  prepare-source:
    if: ${{ github.event_name == 'workflow_dispatch' || !inputs.source_is_prepared }}
    uses: ./.github/workflows/prepare-source.yml
    with:
      display_version: ${{ inputs.display_version }}
      build_type: ${{ inputs.build_type }}
      package_artifacts: ${{ inputs.package_artifacts }}
    secrets: inherit

  macos-build:
    name: macOS ${{ matrix.arch }}
    needs: prepare-source
    if: ${{ always() && (needs.prepare-source.result == 'success' || (github.event_name != 'workflow_dispatch' && inputs.source_is_prepared)) }}
    runs-on: ${{ matrix.arch == 'x86_64' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [ x86_64, aarch64 ]
    env:
      MIDORI_RELEASE: "true"
      MIDORI_RELEASE_BRANCH: ${{ inputs.build_type }}
      SURFER_COMPAT: ${{ matrix.arch }}
      RUSTC_WRAPPER: ${{ inputs.use_sccache && 'sccache' || '' }}
      CARGO_INCREMENTAL: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Setup sccache
        if: ${{ inputs.use_sccache }}
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0

      - name: Enable incremental sccache backend
        if: ${{ inputs.use_sccache }}
        run: |
          echo "SCCACHE_GHA_ENABLED=on" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_VERSION=midori-macos-${{ matrix.arch }}" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          brew install gnu-tar zstd
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Rust
        run: |
          if [ -f .rust-toolchain ]; then
            RUST_VERSION=$(cat .rust-toolchain)
          else
            RUST_VERSION="1.83"
          fi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain "$RUST_VERSION"
          . "$HOME/.cargo/env"
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            rustup target add aarch64-apple-darwin
          else
            rustup target add x86_64-apple-darwin
          fi
          rustc --version

      - name: Install npm dependencies
        run: npm ci

      - name: Set brand
        run: npm run brand

      - name: Activate CI configuration
        run: npm run ci -- --display-version ${{ inputs.display_version }}

      - name: Download prepared source
        uses: actions/download-artifact@v8
        with:
          name: midori.source.tar.zst

      - name: Extract prepared source
        run: |
          mkdir -p engine
          export PATH="$(brew --prefix gnu-tar)/libexec/gnubin:$PATH"
          tar --use-compress-program=zstd -xf midori.source.tar.zst -C engine
          rm midori.source.tar.zst

      - name: Bootstrap
        run: |
          cd engine
          export AMELIA_PLATFORM="darwin"
          ./mach --no-interactive bootstrap --application-choice browser --exclude macos-sdk
          cd ..

      - name: Build
        env:
          AMELIA_PLATFORM: darwin
        run: |
          . "$HOME/.cargo/env"
          if [ -n "${{ inputs.build_id }}" ]; then
            export MOZ_BUILD_DATE="${{ inputs.build_id }}"
          fi
          export MIDORI_RELEASE=1
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            npm run build:mac-arm64 -- --skip-patch-check
          else
            npm run build:mac-x64 -- --skip-patch-check
          fi

      - name: Report sccache statistics
        if: ${{ always() && inputs.use_sccache }}
        run: sccache --show-stats || true

      - name: Verify compiled output
        run: bash scripts/verify-build-output.sh macos "${{ matrix.arch }}"

      - name: Import signing certificate
        if: ${{ inputs.package_artifacts }}
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "No macOS signing certificate configured; producing an unsigned disk image."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/midori-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/midori-signing.p12"
          echo "$CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Sign application bundle
        if: ${{ inputs.package_artifacts }}
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "No macOS signing identity configured; skipping code signing."
            exit 0
          fi
          APP_BUNDLE="$(find engine/obj-* -type d -path '*/dist/Midori.app' -print -quit)"
          test -n "$APP_BUNDLE"
          codesign --force --deep --options runtime --timestamp \
            --sign "$SIGNING_IDENTITY" \
            "$APP_BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"

      - name: Package
        if: ${{ inputs.package_artifacts }}
        env:
          AMELIA_PLATFORM: darwin
        run: |
          export MIDORI_RELEASE=1
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            npm run package:mac-arm64 -- --verbose
          else
            npm run package:mac-x64 -- --verbose
          fi

      - name: Notarize disk image
        if: ${{ inputs.package_artifacts }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "Apple notarization credentials are not configured; skipping notarization."
            exit 0
          fi
          for dmg in dist/*.dmg; do
            test -f "$dmg"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$dmg"
          done

      - name: Summarize macOS packages
        if: ${{ inputs.package_artifacts }}
        run: |
          files="$(find dist -type f \( -name '*.dmg' -o -name '*.mar' -o -path '*/update/*' \) -print | sort)"
          test -n "$files"
          {
            echo "### macOS ${{ matrix.arch }} packages"
            echo
            echo "Artifact: \`macos-${{ matrix.arch }}\`"
            echo
            echo '| File | Format | Size | SHA-256 |'
            echo '| --- | --- | ---: | --- |'
            while IFS= read -r file; do
              name="${file#dist/}"
              case "$name" in
                *.*) format="${name##*.}" ;;
                *) format='file' ;;
              esac
              size="$(du -h "$file" | cut -f1)"
              digest="$(shasum -a 256 "$file" | cut -d' ' -f1)"
              printf '| `%s` | `%s` | %s | `%s` |\n' "$name" "$format" "$size" "$digest"
            done <<< "$files"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: ${{ inputs.package_artifacts }}
        id: upload-macos-artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.mar
            dist/update/
          retention-days: 5
          if-no-files-found: error

      - name: Publish macOS artifact link
        if: ${{ inputs.package_artifacts }}
        env:
          ARTIFACT_URL: ${{ steps.upload-macos-artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload-macos-artifact.outputs.artifact-digest }}
        run: |
          {
            echo
            echo "[Download macOS ${{ matrix.arch }} artifact]($ARTIFACT_URL)"
            echo
            echo "Artifact archive SHA-256: \`$ARTIFACT_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
